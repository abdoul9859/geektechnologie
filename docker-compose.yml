# Docker Compose configuration for GEEKTECHNOLOGIE

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://geekuser:07121998Dabakh%40@mongo:27017/geektech?authSource=admin
      HOST: 0.0.0.0
      PORT: "8000"
      RELOAD: "false"
      INIT_DB_ON_STARTUP: "false"
      SEED_DEFAULT_DATA: "false"
      ENABLE_MIGRATIONS_WORKER: "false"
      N8N_BASE_URL: "http://n8n:5678"
      APP_PUBLIC_URL: "http://app:8000"
      EVOLUTION_API_URL: "http://evolution_api:8080"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-your-api-key}"
      EVOLUTION_INSTANCE_NAME: "${EVOLUTION_INSTANCE_NAME:-geektech}"
    expose:
      - "8000"
    volumes:
      - app_uploads:/app/static/uploads
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      evolution_api:
        condition: service_started
    networks:
      - internal

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: geekuser
      MONGO_INITDB_ROOT_PASSWORD: "07121998Dabakh@"
      MONGO_INITDB_DATABASE: geektech
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  evolution_api:
    image: atendai/evolution-api:v2.2.3
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-your-api-key}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_pass@evolution_db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "GeekTechnologie"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      LOG_LEVEL: DEBUG
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped
    depends_on:
      evolution_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  evolution_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
  evolution_instances:
  evolution_pgdata:
  redis_data:
  app_uploads:
  app_logs:
