# Docker Compose configuration for GEEKTECHNOLOGIE
# Migré vers MongoDB le 2026-02-07

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geektechnologie_app
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://geekuser:07121998Dabakh%40@mongo:27017/geektech?authSource=admin
      HOST: 0.0.0.0
      PORT: "8000"
      RELOAD: "false"
      INIT_DB_ON_STARTUP: "false"
      SEED_DEFAULT_DATA: "false"
      ENABLE_MIGRATIONS_WORKER: "false"
      # n8n base URL pour les webhooks (sans path)
      N8N_BASE_URL: "http://n8n:5678"
      # URL publique de l'application pour les liens accessibles depuis n8n
      APP_PUBLIC_URL: "http://geektechnologie_app:8000"
      # Evolution API WhatsApp
      EVOLUTION_API_URL: "http://evolution_api:8080"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-your-api-key}"
      EVOLUTION_INSTANCE_NAME: "${EVOLUTION_INSTANCE_NAME:-geektech}"
    expose:
      - "8000"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      evolution_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: geektechnologie_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: geekuser
      MONGO_INITDB_ROOT_PASSWORD: "07121998Dabakh@"
      MONGO_INITDB_DATABASE: geektech
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  evolution_api:
    image: atendai/evolution-api:v2.2.3
    container_name: geektechnologie_evolution_api
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-your-api-key}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: mongodb
      DATABASE_CONNECTION_URI: mongodb://geekuser:07121998Dabakh%40@mongo:27017/?authSource=admin
      DATABASE_CONNECTION_DB_PREFIX_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "GeekTechnologie"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      LOG_LEVEL: WARN
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const r = http.get('http://localhost:8080/', res => { process.exit(res.statusCode === 200 ? 0 : 1) }); r.on('error', () => process.exit(1)); r.setTimeout(5000, () => process.exit(1));\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: geektechnologie_redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mongo_data:
  evolution_instances:
  redis_data:
