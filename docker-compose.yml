# Docker Compose configuration for GEEKTECHNOLOGIE
# Migré vers MongoDB le 2026-02-07

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nitek_app
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://geektech:geektech_secret@mongo:27017/geektech?authSource=admin
      HOST: 0.0.0.0
      PORT: "8000"
      RELOAD: "false"
      INIT_DB_ON_STARTUP: "false"
      SEED_DEFAULT_DATA: "false"
      ENABLE_MIGRATIONS_WORKER: "false"
      GOOGLE_SHEETS_CREDENTIALS_PATH: /app/credentials/symbolic-folio-470422-v3-71562b79a03f.json
      GOOGLE_SHEETS_SPREADSHEET_ID: 1VHMujdZw-iPs28pz1rC9Ol72T9l9YTW6Wr9j5ujEsXQ
      GOOGLE_SHEETS_WORKSHEET_NAME: Les produits
      GOOGLE_SHEETS_AUTO_SYNC: "true"
      # n8n base URL pour les webhooks (sans path)
      N8N_BASE_URL: "http://n8n:5678"
      # URL publique de l'application pour les liens accessibles depuis n8n
      APP_PUBLIC_URL: "http://nitek_app:8000"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo:7
    container_name: nitek_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: geektech
      MONGO_INITDB_ROOT_PASSWORD: geektech_secret
      MONGO_INITDB_DATABASE: geektech
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  whatsapp-baileys:
    build:
      context: ./whatsapp-baileys
      dockerfile: Dockerfile
    container_name: whatsapp_baileys
    ports:
      - "0.0.0.0:3002:3002"
    volumes:
      - ./whatsapp-baileys/auth_info:/app/auth_info
    restart: unless-stopped
    environment:
      PORT: "3002"

volumes:
  mongo_data:
